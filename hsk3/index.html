<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор слов · HSK 3</title>
<style>
:root{--bg:#f6f1e8;--card:#fffdf8;--ink:#2a2420;--muted:#8a7e72;--line:#e7ddcd;--red:#c63a2f;--red-d:#a32c22;--good:#2e8b57;--good-bg:#e5f4ea;--bad:#c63a2f;--bad-bg:#fbe7e4;--gold:#d79b1d;--sel:#fff1cf;--sel-b:#e0a82a;--shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.07)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;-webkit-font-smoothing:antialiased}
.hz{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:18px 14px 50px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.seal{width:46px;height:46px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow);flex:none}
.top h1{font-size:19px;margin:0}
.top p{margin:0;color:var(--muted);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;background:var(--red);color:#fff}
.btn:hover{background:var(--red-d)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#f1e9dc}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
.bar{height:8px;background:#efe6d8;border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .3s}
/* board */
.how{font-size:14px;margin:0 0 12px;color:var(--muted)}
.board{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:10px}
.colh{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;text-align:center;margin-bottom:2px}
.col{display:flex;flex-direction:column;gap:8px}
.tile{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 8px;min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center;transition:transform .12s,background .15s,border-color .15s;box-shadow:0 1px 0 rgba(0,0,0,.03);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.tile:hover{border-color:#cdb99b}
.tile.hzt{font-size:26px}
.tile.pyt{font-size:18px}
.tile.trt{font-size:14px;line-height:1.25}
.tile.sel{background:var(--sel);border-color:var(--sel-b);transform:translateY(-2px)}
.tile.ok{background:var(--good-bg);border-color:var(--good)}
.tile.no{background:var(--bad-bg);border-color:var(--bad);animation:shake .35s}
.tile.gone{opacity:0;transform:scale(.85);pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tray{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;margin:14px 0 0;padding:8px;border:2px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.tray .slot{padding:4px 10px;border-radius:8px;background:#f3ebde;color:var(--ink)}
.tray .slot.empty{background:transparent;border:1px dashed #d8ccb8;color:var(--muted)}
.tray .plus{color:var(--muted)}
/* collected */
.collected{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;animation:pop .25s ease;position:relative}
.cc .h{font-size:26px}.cc .p{font-size:14px;color:var(--red)}.cc .t{font-size:13px;color:var(--muted)}
.cc .sp{position:absolute;top:6px;right:6px;border:0;background:none;font-size:14px;padding:2px}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.h3{font-size:15px;font-weight:700;margin:0 0 10px}
/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2a2420;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9;animation:pop .2s}
/* start/result */
.center{text-align:center}
.big{font-size:52px;margin:6px 0}
.stars{font-size:38px;letter-spacing:4px;color:var(--gold)}
.stars .off{color:#dccfbb}
.seg{display:inline-flex;background:#f1e9dc;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-size:13px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.wordlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.chip{background:#f3ebde;border-radius:8px;padding:3px 8px;font-size:17px}
.mist{text-align:left;margin-top:12px}
.mist .m{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.mist .m .hz{font-size:22px;min-width:56px}
@media(max-width:560px){
  .wrap{padding:14px 10px 40px}
  .board{gap:6px;grid-template-columns:.9fr 1fr 1.2fr}
  .tile{padding:10px 4px;min-height:52px;border-radius:10px}
  .tile.hzt{font-size:22px}.tile.pyt{font-size:15px}.tile.trt{font-size:12.5px}
}

/* lessons */
.overall{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.lc{position:relative;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 12px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;transition:box-shadow .15s,border-color .15s}
@media(hover:hover){.lc:hover{border-color:#cdb99b;box-shadow:0 2px 4px rgba(60,40,20,.08),0 10px 26px rgba(60,40,20,.1)}}
.lc .num{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.lc .lt{font-size:16px;line-height:1.3}
.lc .lr{font-size:12.5px;color:var(--muted);line-height:1.3;flex:1}
.lc .lf{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
.lc .st{color:var(--gold);letter-spacing:1px;font-size:14px}.lc .st .off{color:#dccfbb}
.lc.next{border:2px solid var(--red);padding:11px 11px 9px}
.lc .badge{position:absolute;top:-9px;right:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px}
.lc.done{background:#fbf8f1}
.settings{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
@media(max-width:560px){.lgrid{grid-template-columns:1fr 1fr;gap:8px}.lc{padding:10px 9px 8px}.lc.next{padding:9px 8px 7px}.lc .lt{font-size:14.5px}.lc .lr{font-size:11.5px}}
</style>
</head>

let LESSON=null,WORDS=[];
function useLesson(n){LESSON=LESSONS.find(l=>l.n===n);WORDS=LESSON.w.map(([hz,py,ru],id)=>({id,hz,py,ru}))}

const LS='hsk3-constructor';

try{saved=Object.assign(saved,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
try{const old=JSON.parse(localStorage.getItem('hsk3-l1-constructor')||'null');if(old&&old.best!=null&&!saved.res[1]){saved.res[1]={best:old.best,plays:1}}}catch(e){}
function persist(){try{localStorage.setItem(LS,JSON.stringify(saved))}catch(e){}}
const starsOf=acc=>acc>=90?3:acc>=70?2:acc>=40?1:0;
const starHtml=n=>[0,1,2].map(i=>i<n?'★':'<span class="off">★</span>').join('');
const nextLesson=()=>{const l=LESSONS.find(l=>!saved.res[l.n]);return l?l.n:null};
const sub=()=>`HSK 3 · Урок ${LESSON.n}`;

/* озвучка */
const TTS='speechSynthesis' in window;let zhVoice=null;
function loadV(){if(!TTS)return;const v=speechSynthesis.getVoices();zhVoice=v.find(x=>/zh[-_]CN/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null}
if(TTS){loadV();speechSynthesis.onvoiceschanged=loadV}
function speak(t,r){if(!TTS||!saved.audio)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';if(zhVoice)u.voice=zhVoice;u.rate=r||.85;speechSynthesis.speak(u)}catch(e){}}

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const app=document.getElementById('app');
let G=null;

  app.innerHTML=`
  <div class="top"><div class="seal hz">拼</div><div><h1>Конструктор слов · HSK 3</h1><p>Standard Course · 20 уроков · собери иероглиф + пиньинь + перевод</p></div></div>
  <div class="overall"><div class="bar"><i style="width:${doneN/LESSONS.length*100}%"></i></div><span class="muted">пройдено ${doneN}/${LESSONS.length}</span><span class="stat">★ ${totalStars}/${LESSONS.length*3}</span></div>
  <div class="panel"><div class="settings">
    <div><div class="muted" style="margin-bottom:6px">Слов на поле</div><div class="seg">${[[5,'Раундами по 4–7'],[0,'Весь урок сразу']].map(([v,l])=>`<button class="${saved.mode===v?'on':''}" onclick="saved.mode=${v};persist();home()">${l}</button>`).join('')}</div></div>
    <label class="muted"><input type="checkbox" ${saved.audio?'checked':''} onchange="saved.audio=this.checked;persist()"> Озвучивать собранные слова</label>
  </div></div>
  <p class="muted" style="margin:0 0 14px">Уроки можно проходить в любом порядке. Красной рамкой отмечен следующий по порядку непройденный.</p>
  <div class="lgrid">${LESSONS.map(l=>{const r=saved.res[l.n];const isNext=l.n===nx;
    return `<button class="lc ${isNext?'next':''} ${r?'done':''}" onclick="openLesson(${l.n})">${isNext?'<span class="badge">дальше</span>':''}
      <span class="num">УРОК ${l.n}</span><span class="lt hz">${l.t}</span><span class="lr">${l.r}</span>
      <span class="lf"><span>${l.w.length} слов</span>${r?`<span class="st">${starHtml(starsOf(r.best))}</span>`:'<span>—</span>'}</span></button>`}).join('')}</div>
`;
}
function planRounds(n){if(saved.mode===0)return [n];const k=Math.max(1,Math.round(n/5.5));const base=Math.floor(n/k),extra=n%k;return Array.from({length:k},(_,i)=>base+(i<extra?1:0))}
const roundsLabel=n=>{const p=planRounds(n);return p.length===1?`все ${n} слов сразу`:`${p.length} раунда по ${[...new Set(p)].sort().join('–')} слов`.replace(/^(\d+) раунда/,(m,k)=>k>=5?`${k} раундов`:m)};
function openLesson(n){
  useLesson(n);G=null;scrollTo(0,0);const r=saved.res[n];
  app.innerHTML=`
  <div class="top"><div class="seal hz">拼</div><div><h1>Урок ${n} · <span class="hz">${LESSON.t}</span></h1><p>${LESSON.r}</p></div>
    <button class="iconbtn" style="margin-left:auto" onclick="home()">← Уроки</button></div>
  <div class="panel center">
    <p style="margin:0 0 6px">Собери карточку из трёх частей: <b>иероглиф</b> + <b>пиньинь</b> + <b>перевод</b>.<br>Нажимай по одной плитке в каждом столбце — в любом порядке.</p>
    <div class="wordlist">${WORDS.map(w=>`<span class="chip hz">${w.hz}</span>`).join('')}</div>
    <div class="muted">${WORDS.length} слов · ${roundsLabel(WORDS.length)}</div>
    ${r?`<div style="margin-top:10px"><span class="stars" style="font-size:24px">${starHtml(starsOf(r.best))}</span><div class="muted">Лучший результат: <b>${r.best}%</b> без ошибок · попыток: ${r.plays}</div></div>`:''}
    <div style="margin-top:16px"><button class="btn" onclick="startGame()">Начать</button></div>
  </div>`;
}

function startGame(){
  const order=shuffle(WORDS.slice());
  const rounds=[];let i=0;for(const s of planRounds(order.length)){rounds.push(order.slice(i,i+s));i+=s}
  G={rounds,r:0,done:[],errWords:new Set(),firstErr:new Set(),mistakes:0,review:false,sel:{hz:null,py:null,ru:null},lock:false};
  setupRound();
}
function setupRound(){
  const ws=G.rounds[G.r];
  G.cur=ws;G.left=new Set(ws.map(w=>w.id));
  G.cols={hz:shuffle(ws.slice()),py:shuffle(ws.slice()),ru:shuffle(ws.slice())};
  G.sel={hz:null,py:null,ru:null};G.collectedRound=[];
  render();
}
const totalWords=()=>G.review?G.rounds.flat().length:WORDS.length;
function render(){
  const doneN=G.review?G.reviewDone:G.done.length;const total=totalWords();
  const tile=(k,w)=>{const gone=!G.left.has(w.id);if(gone)return '';const sel=G.sel[k]===w.id;
    const txt=k==='hz'?w.hz:k==='py'?w.py:w.ru;const cls=k==='hz'?'hzt hz':k==='py'?'pyt':'trt';
    return `<button class="tile ${cls} ${sel?'sel':''} ${gone?'gone':''}" data-k="${k}" data-id="${w.id}" onclick="pick('${k}',${w.id})">${txt}</button>`};
  const slot=(k,label)=>{const id=G.sel[k];if(id===null)return `<span class="slot empty">${label}</span>`;const w=WORDS[id];return `<span class="slot ${k==='hz'?'hz':''}">${k==='hz'?w.hz:k==='py'?w.py:w.ru}</span>`};
  app.innerHTML=`
  <div class="top"><div class="seal hz">拼</div><div><h1>${G.review?'Работа над ошибками':'Конструктор слов'}</h1><p>${sub()} · ${G.rounds.length>1?`раунд ${G.r+1} из ${G.rounds.length}`:G.review?'повторяем слова с ошибками':'все слова'}</p></div>
    <button class="iconbtn" style="margin-left:auto" onclick="openLesson(LESSON.n)">✕</button></div>
  <div class="row" style="margin-bottom:12px"><div class="bar"><i style="width:${doneN/total*100}%"></i></div><span class="muted">${doneN}/${total}</span><span class="stat">❌ ${G.mistakes}</span></div>
  <div class="panel">
    <p class="how">Выбери по одной плитке в каждом столбце. Собранная карточка уйдёт вниз.</p>
    <div class="board">
      <div><div class="colh">Иероглифы</div><div class="col">${G.cols.hz.map(w=>tile('hz',w)).join('')}</div></div>
      <div><div class="colh">Пиньинь</div><div class="col">${G.cols.py.map(w=>tile('py',w)).join('')}</div></div>
      <div><div class="colh">Перевод</div><div class="col">${G.cols.ru.map(w=>tile('ru',w)).join('')}</div></div>
    </div>
    <div class="tray">${slot('hz','иероглиф')}<span class="plus">+</span>${slot('py','пиньинь')}<span class="plus">+</span>${slot('ru','перевод')}</div>
  </div>
  ${G.collectedRound.length?`<div class="panel"><div class="h3">✅ Собрано в этом раунде</div><div class="collected">${G.collectedRound.map(id=>{const w=WORDS[id];return `<div class="cc"><button class="sp" onclick="speak('${w.hz}')">🔊</button><div class="h hz">${w.hz}</div><div class="p">${w.py}</div><div class="t">${w.ru}</div></div>`}).join('')}</div></div>`:''}`;
}
function pick(k,id){
  if(G.lock||!G.left.has(id))return;
  G.sel[k]=G.sel[k]===id?null:id;
  if(G.sel.hz!==null&&G.sel.py!==null&&G.sel.ru!==null)return check();
  render();
}
function check(){
  const {hz,py,ru}=G.sel;G.lock=true;
  const ok=hz===py&&py===ru;
  const els=['hz','py','ru'].map(k=>document.querySelector(`.tile[data-k="${k}"][data-id="${G.sel[k]}"]`));
  render();
  const els2=['hz','py','ru'].map(k=>document.querySelector(`.tile[data-k="${k}"][data-id="${G.sel[k]}"]`));
  els2.forEach(e=>e&&e.classList.remove('sel'));
  if(ok){
    els2.forEach(e=>e&&e.classList.add('ok'));
    speak(WORDS[hz].hz);
    setTimeout(()=>{
      G.left.delete(hz);G.collectedRound.push(hz);
      if(G.review)G.reviewDone++;else G.done.push(hz);
      G.sel={hz:null,py:null,ru:null};G.lock=false;
      if(G.left.size===0)return roundDone();
      render();
    },550);
  }else{
    G.mistakes++;
    // ошибка засчитывается словам, которые перепутали: если два элемента совпадают, виноват третий
    const ids=[hz,py,ru];const pairMatch=hz===py?ru:hz===ru?py:py===ru?hz:null;
    (pairMatch!==null?[ids.find(x=>x!==pairMatch),pairMatch]:ids).forEach(x=>G.errWords.add(x));
    els2.forEach(e=>e&&e.classList.add('no'));
    setTimeout(()=>{G.sel={hz:null,py:null,ru:null};G.lock=false;render()},650);
  }
}
function roundDone(){
  if(G.r<G.rounds.length-1){toast(['Отлично! 太棒了！','Раунд собран! 很好！','Так держать! 加油！'][G.r%3]);G.r++;setTimeout(setupRound,500);return}
  if(!G.review&&G.errWords.size){
    // работа над ошибками: слова с ошибками (+ дополняем до 4 для честного выбора)
    G.firstErr=new Set(G.errWords);G.firstMistakes=G.mistakes;
    const err=[...G.errWords].map(id=>WORDS[id]);
    let board=err.slice();if(board.length<4)board=board.concat(shuffle(WORDS.filter(w=>!G.errWords.has(w.id))).slice(0,4-board.length));
    const size=Math.min(6,board.length);const rounds=[];for(let i=0;i<board.length;i+=size)rounds.push(board.slice(i,i+size));
    if(rounds.length>1&&rounds[rounds.length-1].length<3){const last=rounds.pop();rounds[rounds.length-1]=rounds[rounds.length-1].concat(last)}
    G.mainRounds=G.rounds.length;G.rounds=rounds;G.r=0;G.review=true;G.reviewDone=0;G.errWords=new Set();
    toast('Теперь — работа над ошибками');setTimeout(setupRound,600);return;
  }
  finish();
}
function finish(){
  const firstErr=G.review?G.firstErr:G.errWords;const mistakes=G.review?G.firstMistakes:G.mistakes;
  const clean=WORDS.length-firstErr.size;const acc=Math.round(clean/WORDS.length*100);
  const st=acc>=90?3:acc>=70?2:acc>=40?1:0;
  const prev=saved.res[LESSON.n];const isBest=!prev||acc>prev.best;
  saved.res[LESSON.n]={best:prev?Math.max(prev.best,acc):acc,plays:(prev?prev.plays:0)+1};persist();
  const nx=nextLesson();const nxt=nx&&nx!==LESSON.n?nx:(LESSON.n<20?LESSON.n+1:null);
  const stars=[0,1,2].map(i=>i<st?'★':'<span class="off">★</span>').join('');
  app.innerHTML=`
  <div class="top"><div class="seal hz">拼</div><div><h1>Готово!</h1><p>${sub()} · собрано карточек: ${WORDS.length}${isBest&&prev?' · новый рекорд!':''}</p></div></div>
  <div class="panel center">
    <div class="stars">${stars}</div>
    <div class="big">${acc}%</div>
    <div><b>${clean} из ${WORDS.length}</b> слов собрано без ошибок · ошибок всего: ${mistakes}</div>
    ${firstErr.size?`<div class="mist"><div class="h3" style="margin-top:12px">Слова, которые путались</div>${[...firstErr].map(id=>{const w=WORDS[id];return `<div class="m"><span class="hz">${w.hz}</span><span style="color:var(--red)">${w.py}</span><span class="muted" style="flex:1">${w.ru}</span><button class="iconbtn" onclick="speak('${w.hz}')">🔊</button></div>`}).join('')}</div>`:'<p>Ни одной ошибки — 太棒了！</p>'}
    <div class="row" style="justify-content:center;margin-top:16px"><button class="btn ghost" onclick="home()">Все уроки</button><button class="btn ghost" onclick="startGame()">↻ Ещё раз</button>${nxt?`<button class="btn" onclick="openLesson(${nxt})">Урок ${nxt} →</button>`:''}</div>
  </div>`;
}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1400)}
home();
</script>
