<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>汉字卡片 · Карточки HSK 4–5</title>
<style>
:root{
  --bg:#f6f1e8;--card:#fffdf8;--ink:#2a2420;--muted:#8a7e72;--line:#e7ddcd;
  --red:#c63a2f;--red-d:#a32c22;--good:#2e8b57;--good-bg:#e5f4ea;--bad:#c63a2f;--bad-bg:#fbe7e4;--gold:#d79b1d;
  --t1:#d0342c;--t2:#e08600;--t3:#2c9a4c;--t4:#2b6ad0;--t5:#9a9086;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased}
.hz{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.seal{width:46px;height:46px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:24px;box-shadow:var(--shadow)}
.brand h1{font-size:20px;margin:0}
.brand p{margin:0;color:var(--muted);font-size:13px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.stat b{font-variant-numeric:tabular-nums}
/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.seg{display:inline-flex;background:#f1e9dc;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-size:13px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;user-select:none;cursor:pointer}
.sw{width:38px;height:22px;border-radius:999px;background:#d9cebd;position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on .sw{background:var(--red)}
.toggle.on .sw::after{left:19px}
.review{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.review h3{margin:0 0 2px;font-size:16px}
.review p{margin:0;color:var(--muted);font-size:13px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;background:var(--red);color:#fff;transition:.15s}
.btn:hover{background:var(--red-d)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#f1e9dc}
.btn.small{padding:7px 12px;font-size:13px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.inp{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#fff}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0 12px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tab b{font-size:15px}.tab span{font-size:12px;color:var(--muted)}
.tab.on{border-color:var(--red);box-shadow:0 0 0 2px rgba(198,58,47,.15)}
.tab.on b{color:var(--red)}
@media(max-width:900px){.tabs{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.tabs{grid-template-columns:repeat(2,1fr)}.tab span{font-size:11px}}
.navbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.navbtn:hover{border-color:var(--red);color:var(--red)}
.scrtitle{margin:0;font-size:20px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;box-shadow:var(--shadow);transition:.15s;display:flex;flex-direction:column;gap:4px}
.dcard:hover:not(:disabled){transform:translateY(-2px);border-color:#d6c6ae}
.dcard:disabled{opacity:.55;cursor:default}
.dic{font-size:28px}.dt{font-weight:700;font-size:16px}.dd{font-size:13px;color:var(--muted);flex:1}
.dn{font-size:12px;color:var(--red);font-weight:600;margin-top:6px}
.sect2{font-size:17px;margin:26px 2px 12px;display:flex;flex-direction:column;gap:2px}
.sect2 span{font-size:13px;color:var(--muted);font-weight:400}
.keys{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;margin-top:4px}
kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-family:inherit;font-size:12px;background:#fff}
.tabbar{position:sticky;top:0;z-index:20;display:flex;gap:4px;background:rgba(246,241,232,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:8px 0;margin:-8px 0 14px;border-bottom:1px solid var(--line)}
.tbtn{flex:1;border:0;background:transparent;border-radius:12px;padding:8px 6px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;color:var(--muted)}
.tbtn:hover{background:#efe6d8}
.tbtn.on{color:var(--red);background:var(--card);box-shadow:var(--shadow)}
.tic{position:relative;font-size:18px}
.tbadge{position:absolute;top:-4px;right:-10px;font-style:normal;font-size:10px;background:var(--good);color:#fff;border-radius:99px;padding:0 4px;line-height:14px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 8px;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.qbtn span{font-size:24px}
.qbtn:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.qbtn:disabled{opacity:.5;cursor:default}
@media(max-width:700px){
  .tabbar{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-bottom:0;background:rgba(255,253,248,.96)}
  .tbtn{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px}
  .tbtn.on{box-shadow:none;background:#f6ece0}
  .tic{font-size:22px}
  .wrap{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  .quick{grid-template-columns:repeat(2,1fr)}
}
/* new modes */
.sent{font-size:clamp(22px,4.5vw,30px);line-height:1.7;max-width:680px}
.blank{display:inline-block;min-width:2.4em;border-bottom:3px solid var(--red);color:transparent;margin:0 2px}
.trl{color:var(--muted);font-size:15px;min-height:22px}
.trl small{display:block;font-size:13px}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:0}
.pyopt{font-size:24px;letter-spacing:.02em}
.typebox{display:flex;gap:8px;margin:14px auto 0;max-width:520px}
.typebox .inp{font-size:20px}
.hwwrap{margin-top:14px}
.hwbox{width:min(300px,78vw);height:min(300px,78vw);margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;touch-action:none;
  background-image:linear-gradient(to right,transparent calc(50% - .5px),#eadfce calc(50% - .5px),#eadfce calc(50% + .5px),transparent calc(50% + .5px)),linear-gradient(to bottom,transparent calc(50% - .5px),#eadfce calc(50% - .5px),#eadfce calc(50% + .5px),transparent calc(50% + .5px)),linear-gradient(45deg,transparent calc(50% - .5px),#f1e8da calc(50% - .5px),#f1e8da calc(50% + .5px),transparent calc(50% + .5px)),linear-gradient(-45deg,transparent calc(50% - .5px),#f1e8da calc(50% - .5px),#f1e8da calc(50% + .5px),transparent calc(50% + .5px))}
.hwanim{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.hwmini{width:110px;height:110px;border:1px solid var(--line);border-radius:10px;background:#fff}
.pair{border-top:1px dashed var(--line);padding:10px 0}
.pairw{font-size:22px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pairw small{font-size:13px;color:var(--muted)}
.vs{font-size:12px;color:var(--muted);margin:0 8px;font-family:inherit}
.paire{font-size:14px;margin-top:4px;line-height:1.5}
.iconbtn.tiny{padding:2px 6px;font-size:12px}
.sheet{max-height:88vh;overflow:auto}
/* levels */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lvl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;transition:.15s;position:relative;box-shadow:var(--shadow)}
.lvl:hover{transform:translateY(-2px);border-color:#d6c6ae}
.lvl .n{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em}
.lvl .ic{font-size:26px;position:absolute;right:12px;top:10px}
.lvl .t{font-weight:700;margin-top:4px;font-size:15px;padding-right:32px}
.lvl .z{color:var(--red);font-size:15px}
.bar{height:6px;background:#efe6d8;border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:99px;transition:width .3s}
.lvl .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:6px}
.lvl .meta .stars{white-space:nowrap}
.stars{color:var(--gold);letter-spacing:1px}
.stars .off{color:#dccfbb}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(40,25,10,.35);display:grid;place-items:center;padding:16px;z-index:10}
.sheet{background:var(--card);border-radius:18px;padding:20px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet h2{margin:0 0 2px}
.sheet .words{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.chip{background:#f3ebde;border-radius:8px;padding:3px 8px;font-size:15px}
.sheet .acts{display:grid;gap:8px}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qtop .bar{flex:1;margin:0;height:8px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-size:14px}
.iconbtn.on{background:var(--red);color:#fff;border-color:var(--red)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 20px;box-shadow:var(--shadow);text-align:center;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative}
.qhint{position:absolute;top:12px;left:16px;font-size:12px;color:var(--muted)}
.combo{position:absolute;top:12px;right:16px;font-size:13px;color:var(--gold);font-weight:700}
.bighz{font-size:clamp(54px,12vw,92px);line-height:1.1}
.py{font-size:20px;color:var(--muted);min-height:28px}
.meaning{font-size:24px;font-weight:600}
.meaning small,.opt small{display:block;font-size:.72em;font-weight:400;color:var(--muted)}
.speak{border:0;background:var(--red);color:#fff;width:96px;height:96px;border-radius:50%;font-size:40px;box-shadow:0 8px 24px rgba(198,58,47,.35)}
.speak:active{transform:scale(.96)}
.subbtns{display:flex;gap:8px;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 14px 14px 46px;text-align:left;position:relative;min-height:62px;font-size:17px;transition:.12s}
.opt:hover:not(:disabled){border-color:#cdb99b;background:#fffaf0}
.opt .num{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:7px;background:#f1e9dc;font-size:12px;display:grid;place-items:center;color:var(--muted);font-weight:700}
.opt.hzopt{font-size:28px}
.opt.hzopt small{font-size:14px}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.reveal{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rv-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rv-hz{font-size:44px}
.rv-py{font-size:20px}
.rv-m{font-size:16px}
.rv-m .en{color:var(--muted)}
.ex{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.ex .zh{font-size:20px}
.ex .ru{color:var(--muted);font-size:14px;margin-top:2px}
mark{background:#fde6b8;color:inherit;border-radius:4px;padding:0 2px}
.verdict{font-weight:700;margin-bottom:8px}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.nextrow{display:flex;justify-content:flex-end;margin-top:12px;gap:8px;align-items:center}
.kbd{font-size:11px;color:var(--muted)}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
/* study */
.flash{perspective:1200px;margin:6px 0 14px}
.flash-inner{position:relative;min-height:330px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;gap:8px}
.face.back{transform:rotateY(180deg)}
.face .tap{position:absolute;bottom:12px;font-size:12px;color:var(--muted)}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
/* result */
.result{text-align:center}
.result .big{font-size:56px;margin:4px 0}
.result .bigstars{font-size:40px;color:var(--gold);letter-spacing:4px}
.result .bigstars .off{color:#dccfbb}
.mlist{text-align:left;margin-top:12px}
.mitem{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.mitem .hz{font-size:24px;min-width:70px}
.mitem .info{flex:1;font-size:14px}
.legend{display:flex;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:8px}
.footer{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
</style>
</head>

/* ================== ДАННЫЕ ================== */
const LEVELS = RAW.map((L,id)=>({id,t:L.t,z:L.z,i:L.i,g:L.h===4?'hsk4':L.h===52?'hsk5b':L.h===5?'hsk5':id<24?'base':'ext',words:L.w.trim().split('\n').map(line=>{
  const [hz,py,ru,en,ex,exru]=line.split('|').map(s=>s.trim());
  return {hz,py,ru,en,ex,exru,lvl:id};
})}));
const ALL = LEVELS.flatMap(l=>l.words);

const LS_KEY='hanzi-cards-hsk45-v1';
const DEF_SETTINGS={lang:'both',showPinyin:false,mode:'mixed',autoAudio:true,tab:'base'};
const TABS=[['base','Базовый'],['ext','Расширенный'],['hsk5','HSK 5 · темы'],['hsk5b','HSK 5 · части речи'],['hsk4','HSK 4 · добор']];
let store={srs:{},levels:{},daily:{},xp:0,streak:{last:null,count:0},settings:{...DEF_SETTINGS}};
try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(s){store=Object.assign(store,s);store.settings=Object.assign({...DEF_SETTINGS},s.settings||{});store.daily=store.daily||{};}}catch(e){}
let storageOK=true;
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(store));storageOK=localStorage.getItem(LS_KEY)!==null}catch(e){storageOK=false}}
try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){storageOK=false}

/* ================== ИНТЕРВАЛЬНОЕ ПОВТОРЕНИЕ (Лейтнер) ================== */
const INTERVALS=[0,1,3,7,14,30,60]; // дни для коробок 0..6
const DAY=864e5;
function srs(w){return store.srs[w.hz]}
function srsUpdate(w,ok){
  const r=store.srs[w.hz]||{b:0,d:0,c:0,x:0};
  if(ok){r.c++;
    // повышаем этап, только если слово новое или уже пора повторять (интервалы работают по дням)
    if(r.b===0||r.d<=Date.now()){r.b=Math.min(r.b+1,6);r.d=Date.now()+INTERVALS[r.b]*DAY;}}
  else{r.b=0;r.x++;r.d=Date.now();}
  store.srs[w.hz]=r;save();
}
function isMastered(w){const r=srs(w);return !!(r&&r.b>=3)}
function isStarted(w){const r=srs(w);return !!(r&&r.c>0)}
function levelProgress(l){return l.words.reduce((a,w)=>{const r=srs(w);return a+(r?(r.c>0?1:0)+Math.min(r.b,3):0)},0)/(l.words.length*4)}
function dueWords(){const now=Date.now();return ALL.filter(w=>{const r=srs(w);return r&&r.d<=now}).sort((a,b)=>srs(a).b-srs(b).b)}

/* ================== ПИНЬИНЬ И ТОНА ================== */
const VOW='aāáǎàeēéěèiīíǐìoōóǒòuūúǔùüǖǘǚǜ';
const TONE={};'āēīōūǖ'.split('').forEach(c=>TONE[c]=1);'áéíóúǘ'.split('').forEach(c=>TONE[c]=2);'ǎěǐǒǔǚ'.split('').forEach(c=>TONE[c]=3);'àèìòùǜ'.split('').forEach(c=>TONE[c]=4);
const INITS=['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s','y','w'];
const SEP=/[\s'’\-]/;
const segCache={};
function segment(py,n){
  const key=py+'#'+n; if(key in segCache)return segCache[key];
  const s=py.toLowerCase();
  function rec(pos,acc){
    while(pos<s.length&&SEP.test(s[pos]))pos++;
    if(pos>=s.length)return acc.length===n?acc:null;
    if(acc.length>=n)return null;
    const boundary=pos===0||SEP.test(s[pos-1]);
    const opts=INITS.filter(i=>s.startsWith(i,pos));if(boundary)opts.push('');
    for(const ini of opts){
      const p=pos+ini.length;let q=p;while(q<s.length&&VOW.includes(s[q]))q++;
      if(q===p)continue;
      for(const fin of ['ng','n','r','']){
        if(fin&&!s.startsWith(fin,q))continue;
        if(fin==='r'&&!(ini===''&&/^[eēéěè]$/.test(s.slice(p,q))))continue;
        const end=q+fin.length;
        const r=rec(end,acc.concat([[pos,end]]));if(r)return r;
      }
    }
    return null;
  }
  const res=rec(0,[]);
  const out=res?res.map(([a,b])=>{let t=5;for(const c of s.slice(a,b))if(TONE[c]){t=TONE[c];break}return {a,b,t}}):null;
  segCache[key]=out;return out;
}
const isHan=c=>/[一-鿿]/.test(c);
function colorize(w){
  const hzChars=[...w.hz];const n=hzChars.filter(isHan).length;
  const seg=segment(w.py,n);
  if(!seg)return {hz:w.hz,py:w.py};
  let k=0;const hz=hzChars.map(c=>isHan(c)?`<span class="t${seg[k++].t}">${c}</span>`:c).join('');
  let py='',last=0;seg.forEach(({a,b,t})=>{py+=w.py.slice(last,a)+`<span class="t${t}">${w.py.slice(a,b)}</span>`;last=b});py+=w.py.slice(last);
  return {hz,py};
}

/* ================== ОЗВУЧКА ================== */
const TTS='speechSynthesis' in window;
let zhVoice=null,voicesLoaded=false;
function loadVoices(){if(!TTS)return;const vs=speechSynthesis.getVoices();if(vs.length)voicesLoaded=true;zhVoice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang)&&!/HK|TW/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;}
if(TTS){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(TAB_SCREENS.some(t=>t[0]===screen))render()};}
function speak(text,rate){if(!TTS)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';if(zhVoice)u.voice=zhVoice;u.rate=rate||0.85;speechSynthesis.speak(u);}catch(e){}}

/* ================== УТИЛИТЫ ================== */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stars(n,cls){let s='';for(let i=0;i<3;i++)s+=i<n?'★':`<span class="off">★</span>`;return `<span class="${cls||'stars'}">${s}</span>`}
function meaningHTML(w){const L=store.settings.lang;if(L==='ru')return w.ru;if(L==='en')return w.en;return `${w.ru}<small>${w.en}</small>`}
function exampleHTML(w){const zh=w.ex.split(w.hz).join(`<mark>${w.hz}</mark>`);return `<div class="ex"><div class="row" style="gap:8px;align-items:flex-start"><button class="iconbtn" onclick="speak(${JSON.stringify(w.ex).replace(/"/g,'&quot;')},0.8)" title="Озвучить пример">🔊</button><div style="flex:1;text-align:left"><div class="zh hz">${zh}</div><div class="ru">${w.exru}</div></div></div></div>`}
function distractors(w,k){
  let pool=shuffle(LEVELS[w.lvl].words.filter(x=>x!==w));
  if(pool.length<k)pool=pool.concat(shuffle(ALL.filter(x=>x!==w&&!pool.includes(x))));
  return pool.slice(0,k);
}
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function bumpStreak(){const t=todayStr();if(store.streak.last===t)return;const y=new Date(Date.now()-DAY);store.streak.count=store.streak.last===todayStr(y)?store.streak.count+1:1;store.streak.last=t;save();}
function currentStreak(){const t=todayStr(),y=todayStr(new Date(Date.now()-DAY));return (store.streak.last===t||store.streak.last===y)?store.streak.count:0}

/* ================== СИНХРОНИЗАЦИЯ (Cloudflare Worker + KV) ==================
   Прогресс хранится под ключом SHA-256 от «секретного имени» игрока.
   При синхронизации локальная и облачная версии сливаются: по каждому слову
   берётся запись с большим числом ответов, по уровням — лучший результат. */
const SYNC_URL='https://hanzi-sync.lebedev-s.workers.dev/p/';
const SYNC_LS='hanzi-cards-sync-v1';
let sync={name:'',key:'',last:0,status:'off',msg:''};
try{const t=JSON.parse(localStorage.getItem(SYNC_LS)||'null');if(t)sync=Object.assign(sync,t,{status:t.key?'idle':'off',msg:''})}catch(e){}
function saveSync(){try{localStorage.setItem(SYNC_LS,JSON.stringify({name:sync.name,key:sync.key,last:sync.last}))}catch(e){}}
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function mergeStores(a,b){
  if(!b||typeof b!=='object')return a;
  const m={...a,srs:{...(a.srs||{})},levels:{...(a.levels||{})},daily:{...(a.daily||{})}};
  for(const [k,r] of Object.entries(b.srs||{})){const l=m.srs[k];
    if(!l||(r.c+r.x)>(l.c+l.x)||((r.c+r.x)===(l.c+l.x)&&r.b>l.b))m.srs[k]=r;}
  for(const [k,r] of Object.entries(b.levels||{})){const l=m.levels[k]||{best:0,acc:0};m.levels[k]={best:Math.max(l.best||0,r.best||0),acc:Math.max(l.acc||0,r.acc||0)};}
  for(const [k,r] of Object.entries(b.daily||{})){const l=m.daily[k];m.daily[k]={acc:Math.max(l?l.acc:0,r.acc||0)};}
  m.xp=Math.max(a.xp||0,b.xp||0);
  const sa=a.streak||{},sb=b.streak||{};
  const later=(x,y)=>(x.last&&y.last)?(new Date(x.last.replace(/-(\d)(?!\d)/g,'-0$1'))>=new Date(y.last.replace(/-(\d)(?!\d)/g,'-0$1'))):!!x.last;
  m.streak=(sa.last===sb.last)?{last:sa.last,count:Math.max(sa.count||0,sb.count||0)}:(later(sa,sb)?sa:sb);
  m.settings=a.settings;
  return m;
}
let syncBusy=false,syncAgain=false;
async function syncNow(){
  if(!sync.key||!SYNC_OK)return;
  if(syncBusy){syncAgain=true;return}
  syncBusy=true;sync.status='busy';sync.msg='';if(TAB_SCREENS.some(t=>t[0]===screen))render();
  try{
    const r=await fetch(SYNC_URL+sync.key,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const remote=await r.json();
    store=mergeStores(store,remote);save();
    const payload={...store,settings:undefined,updatedAt:Date.now()};
    const w=await fetch(SYNC_URL+sync.key,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!w.ok)throw new Error('HTTP '+w.status);
    sync.last=Date.now();sync.status='ok';saveSync();
  }catch(e){sync.status='err';sync.msg='нет связи с сервером — прогресс сохранён на устройстве и отправится позже'}
  syncBusy=false;
  if(TAB_SCREENS.some(t=>t[0]===screen))render();
  if(syncAgain){syncAgain=false;syncNow()}
}
async function connectSync(){
  const inp=document.getElementById('syncName');const name=(inp&&inp.value||'').trim();
  if(name.length<6){sync.msg='Имя должно быть не короче 6 символов';render();return}
  sync.name=name;sync.key=await sha256('hanzi-cards:'+name.toLowerCase());saveSync();
  await syncNow();
}
function disconnectSync(){sync={name:'',key:'',last:0,status:'off',msg:''};saveSync();render()}
const SYNC_OK=/github\.io$|^127\.0\.0\.1$|^localhost$/.test(location.hostname);
function syncHTML(){
  if(!SYNC_OK)return '';
  if(!sync.key)return `<div class="panel">
    <div class="review"><div><h3>☁️ Синхронизация между устройствами</h3>
    <p>Придумайте секретное имя (например, <i>тигрица-4821</i>) и введите его же на телефоне и ноутбуке — прогресс будет общим. Любой, кто знает имя, увидит прогресс, поэтому лучше добавить цифры.</p></div></div>
    <div class="row" style="margin-top:10px;gap:8px"><input id="syncName" class="inp" placeholder="секретное имя" autocomplete="off" onkeydown="if(event.key==='Enter')connectSync()"><button class="btn" onclick="connectSync()">Подключить</button></div>
    ${sync.msg?`<div class="note" style="color:var(--bad)">${sync.msg}</div>`:''}
  </div>`;
  const t=sync.last?new Date(sync.last).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'—';
  const st={busy:'⏳ синхронизация…',ok:'✓ синхронизировано в '+t,err:'⚠️ '+sync.msg,idle:sync.last?'последняя синхронизация в '+t:'ещё не синхронизировано'}[sync.status]||'';
  return `<div class="panel review"><div><h3>☁️ Синхронизация: <span class="hz">${sync.name.replace(/[<>&"]/g,'')}</span></h3><p style="${sync.status==='err'?'color:var(--bad)':''}">${st}</p></div>

}

/* ================== ТРЕНИРОВКА ДНЯ ==================
   10 новых слов в день — одинаковые для всех (порядок задан фиксированным зерном),
   плюс до 10 личных слов на повторение. За 58 дней проходится весь словарь. */
const DAILY_NEW=10,DAILY_REVIEW=10;
const EPOCH=new Date(2026,10,16);
function dayIndex(){const d=new Date();const a=new Date(d.getFullYear(),d.getMonth(),d.getDate());return Math.round((a-EPOCH)/DAY)}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const DAILY_ORDER=(()=>{const r=mulberry32(20261116);const a=ALL.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a})();
function dailyNew(){const n=DAILY_ORDER.length,start=((dayIndex()*DAILY_NEW)%n+n)%n;const out=[];for(let i=0;i<DAILY_NEW;i++)out.push(DAILY_ORDER[(start+i)%n]);return out}
function dailyReview(){const nw=dailyNew();return dueWords().filter(w=>!nw.includes(w)).slice(0,DAILY_REVIEW)}
function startDaily(){startQuiz(dailyNew().concat(dailyReview()),'📅 Тренировка дня',null,true)}
function dailyHTML(){
  const nw=dailyNew(),rv=dailyReview(),done=store.daily[todayStr()];
  const d=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  return `<div class="panel daily">
    <div class="review">
      <div><h3>📅 Тренировка дня · ${d} ${done?'<span style="color:var(--good)">✓ выполнено ('+done.acc+'%)</span>':''}</h3>
      <p>10 новых слов из разных тем — сегодня они одинаковые у всех игроков${rv.length?`, плюс <b>${rv.length}</b> ваших на повторение`:''}. Можно сравнить результат 🙂</p></div>
      <button class="btn ${done?'ghost':''}" onclick="startDaily()">${done?'Пройти ещё раз':'Начать'}</button>
    </div>
    <div class="words" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">${nw.map(w=>`<span class="chip hz" title="${w.ru}" style="${isMastered(w)?'background:#cfeedb':isStarted(w)?'background:#fbeac4':''}">${w.hz}</span>`).join('')}</div>
  </div>`;
}

/* ---------- Пиньинь: тоны и ввод ---------- */
const MARKS={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
function stripTone(s){return s.normalize('NFD').replace(/[\u0300\u0301\u0304\u030C]/g,'').normalize('NFC')}
function segOf(w){return segment(w.py,[...w.hz].filter(isHan).length)}
function markSyl(base,t){
  if(t===5)return base;let idx=-1;
  if(base.includes('a'))idx=base.indexOf('a');else if(base.includes('e'))idx=base.indexOf('e');else if(base.includes('ou'))idx=base.indexOf('o');
  else{for(let i=base.length-1;i>=0;i--)if('iouü'.includes(base[i])){idx=i;break}}
  if(idx<0)return base;return base.slice(0,idx)+MARKS[base[idx]][t-1]+base.slice(idx+1);
}
function toneOptions(w){
  const sg=segOf(w);if(!sg)return null;
  const orig=sg.map(s=>s.t);if(!orig.some(t=>t!==5))return null;
  const bases=sg.map(({a,b})=>stripTone(w.py.slice(a,b).toLowerCase()));
  const build=ts=>{let out='',last=0;sg.forEach(({a,b},i)=>{out+=w.py.slice(last,a)+markSyl(bases[i],ts[i]);last=b});return out+w.py.slice(last)};
  const correct=build(orig);const set=new Set([correct]);const free=orig.map((t,i)=>t!==5?i:-1).filter(i=>i>=0);
  let guard=0;
  while(set.size<4&&guard++<60){const ts=orig.slice();const i=free[Math.floor(Math.random()*free.length)];ts[i]=1+Math.floor(Math.random()*4);set.add(build(ts))}
  while(set.size<4&&guard++<200){set.add(build(orig.map(t=>t===5?5:1+Math.floor(Math.random()*4))))}
  return set.size<2?null:{correct,opts:shuffle([...set])};
}
function numericPy(py,sg){return sg.map(({a,b,t})=>stripTone(py.slice(a,b).toLowerCase())+(t===5?'':t)).join('')}
function normTyped(s,n){
  s=s.trim().toLowerCase().replace(/u:/g,'ü').replace(/v/g,'ü');
  if(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/.test(s)){const sg=segment(s,n);if(sg)return numericPy(s,sg)}
  return s.replace(/[\s'’\-]/g,'').replace(/[05]/g,'');
}
function checkTyped(){
  if(!Q||Q.answered)return;const it=Q.items[Q.i];const inp=document.getElementById('pyInput');if(!inp)return;
  const val=inp.value;if(!val.trim()){inp.focus();return}
  const sg=segOf(it.w);const n=sg.length;const want=numericPy(it.w.py,sg);const got=normTyped(val,n);
  const loose=x=>x.replace(/ü/g,'u');
  it.typed=val;it.letters=loose(want.replace(/\d/g,''))===loose(got.replace(/\d/g,''));
  settle(got===want||loose(got)===loose(want));
}

/* ---------- Письмо иероглифов (Hanzi Writer, MIT) ---------- */
let HW_P=null,hwState=null;
function loadHW(){if(window.HanziWriter)return Promise.resolve();if(HW_P)return HW_P;
  HW_P=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js';s.onload=res;s.onerror=()=>{HW_P=null;rej()};document.head.appendChild(s)});return HW_P}
const hwLoader=(c,onLoad,onErr)=>fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/'+encodeURIComponent(c)+'.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(onLoad).catch(e=>onErr&&onErr(e));
function hwFail(){const el=document.getElementById('hw');if(el)el.innerHTML='<div class="note" style="padding:20px">Не удалось загрузить данные для письма — нужен интернет.</div>'}
function startWriting(){
  const it=Q.items[Q.i];hwState={chars:[...it.w.hz].filter(isHan),i:0,mist:0,gaveUp:false,writer:null,item:it};
  loadHW().then(hwChar).catch(hwFail);
}
function hwChar(){
  const el=document.getElementById('hw');if(!el||!hwState||Q.items[Q.i]!==hwState.item)return;
  el.innerHTML='';const size=el.clientWidth||260;const ch=hwState.chars[hwState.i];
  const pr=document.getElementById('hwProg');if(pr)pr.textContent=hwState.chars.length>1?`иероглиф ${hwState.i+1} из ${hwState.chars.length}`:'';
  const wr=HanziWriter.create(el,ch,{width:size,height:size,padding:12,showCharacter:false,showOutline:false,drawingWidth:26,strokeColor:'#2a2420',drawingColor:'#2a2420',highlightColor:'#e08600',outlineColor:'#e7ddcd',showHintAfterMisses:3,highlightOnComplete:true,charDataLoader:(c,a,b)=>hwLoader(c,a,()=>{b&&b();setTimeout(hwNext,0)})});
  hwState.writer=wr;
  wr.quiz({onComplete:s=>{if(!hwState)return;hwState.mist+=s.totalMistakes;setTimeout(hwNext,450)}});
}
function hwNext(){if(!hwState)return;hwState.i++;if(hwState.i<hwState.chars.length)hwChar();else{const n=hwState.chars.length,ok=!hwState.gaveUp&&hwState.mist<=n*2;hwState=null;settle(ok)}}
function hwHint(){if(!hwState||!hwState.writer)return;hwState.mist+=2;hwState.writer.showOutline()}
function hwGiveUp(){if(!hwState||!hwState.writer)return;hwState.gaveUp=true;const wr=hwState.writer;try{wr.cancelQuiz()}catch(e){}wr.showOutline();wr.animateCharacter({onComplete:()=>setTimeout(hwNext,500)})}
function hwAnimate(hz,elId){
  const el=document.getElementById(elId);if(!el)return;el.innerHTML='<span class="note">загрузка…</span>';
  loadHW().then(()=>{el.innerHTML='';const chars=[...hz].filter(isHan);const ws=chars.map(c=>{const d=document.createElement('div');d.className='hwmini';el.appendChild(d);
    return HanziWriter.create(d,c,{width:110,height:110,padding:6,showOutline:true,showCharacter:false,strokeAnimationSpeed:1.2,delayBetweenStrokes:250,strokeColor:'#c63a2f',outlineColor:'#eee3d3',charDataLoader:hwLoader})});
    let i=0;const go=()=>{if(i<ws.length)ws[i++].animateCharacter({onComplete:()=>setTimeout(go,300)})};go();
  }).catch(()=>{el.innerHTML='<span class="note">Нужен интернет для показа порядка черт</span>'});
}

/* ---------- Тренировки ---------- */
const DRILLS=[
  {id:'cloze',i:'📝',t:'Предложения',d:'Вставьте пропущенное слово в пример — учит контексту и сочетаемости.',n:15},
  {id:'tone',i:'🎵',t:'Тоны',d:'Слушаете слово и выбираете правильные тоны.',n:15},
  {id:'type',i:'⌨️',t:'Пиньинь',d:'Печатаете чтение с тонами: ni3hao3 или nǐhǎo.',n:12},
  {id:'write',i:'✍️',t:'Письмо',d:'Рисуете иероглиф по чертам — игра проверяет порядок.',n:8},
  {id:'weak',i:'🩹',t:'Слабые слова',d:'Слова, в которых вы чаще всего ошибались, в смешанном режиме.',n:15},
];
const DRILL_MIN=6;
function studiedWords(){return ALL.filter(isStarted)}
function weakWords(){return ALL.filter(w=>{const r=srs(w);return r&&r.x>0}).sort((a,b)=>{const ra=srs(a),rb=srs(b);return (rb.x/(rb.c+1))-(ra.x/(ra.c+1))||ra.b-rb.b})}
function drillPool(id){
  if(id==='weak')return weakWords();
  let pool=studiedWords();
  if(id==='cloze')pool=pool.filter(w=>w.ex&&w.ex.includes(w.hz));
  if(id==='tone'||id==='type')pool=pool.filter(w=>segOf(w));
  return pool;
}
function pickDrillWords(id,n){
  const pool=drillPool(id);if(id==='weak')return pool.slice(0,n);
  const now=Date.now();
  const due=shuffle(pool.filter(w=>srs(w).d<=now)),rest=shuffle(pool.filter(w=>srs(w).d>now)).sort((a,b)=>srs(a).b-srs(b).b);
  return due.concat(rest).slice(0,n);
}
function startDrill(id){
  const d=DRILLS.find(x=>x.id===id);const words=pickDrillWords(id,d.n);if(words.length<(id==='weak'?1:DRILL_MIN))return;
  startQuiz(words,`${d.i} ${d.t}`,null,false,id==='weak'?'mix':id);Q.back='drills';
}
function renderDrills(){
  const studied=studiedWords().length;
  app.innerHTML=`
  ${tabbarHTML()}<h2 class="scrtitle" style="margin:4px 0 10px">🎯 Тренировки</h2>
  <div class="note" style="margin:-4px 0 12px">Тренировки идут по словам, которые вы уже начали учить (сейчас: <b>${studied}</b>). Сначала берутся слова, которые пора повторить. Результаты попадают в интервальное повторение.</div>
  <div class="dgrid">
    ${DRILLS.map(d=>{const n=drillPool(d.id).length;const okN=d.id==='weak'?n>=1:n>=DRILL_MIN;
      return `<button class="dcard" ${okN?'':'disabled'} onclick="startDrill('${d.id}')">
        <div class="dic">${d.i}</div><div class="dt">${d.t}</div><div class="dd">${d.d}</div>
        <div class="dn">${okN?`${Math.min(n,d.n)} слов за подход`:d.id==='weak'?'Ошибок пока нет 🎉':`Нужно хотя бы ${DRILL_MIN} изученных слов — пройдите уровень`}</div></button>`}).join('')}
  </div>
  <h2 class="sect2">⚖️ Похожие слова <span>${CONF_RAW.length} пар, которые легко перепутать: сначала объяснение, потом задания</span></h2>
  <div class="grid">${confCardsHTML()}</div>
  ${typeof sheet==='string'?sheetHTML(sheet):''}`;
}

  ${SYNC_OK?syncHTML():''}
  <div class="panel">
    <div class="lbl">Цвета тонов</div>
    <div class="legend" style="font-size:15px;margin-top:4px"><span class="t1">1-й ā</span><span class="t2">2-й á</span><span class="t3">3-й ǎ</span><span class="t4">4-й à</span><span class="t5">лёгкий</span></div>
    <div class="lbl" style="margin-top:16px">Горячие клавиши (на компьютере)</div>
    <div class="keys"><span><kbd>1</kbd>–<kbd>4</kbd> выбрать ответ</span><span><kbd>Enter</kbd> дальше</span><span><kbd>P</kbd> пиньинь</span><span><kbd>R</kbd> озвучить</span><span><kbd>Esc</kbd> выйти</span><span><kbd>Пробел</kbd> перевернуть карточку</span></div>
  </div>`;
}
function openScreen(s){sheet=null;screen=s;render();window.scrollTo(0,0)}
function exitQuiz(){const b=Q&&Q.back;if(TTS)speechSynthesis.cancel();Q=null;hwState=null;if(b){openScreen(b)}else goHome()}
function syncBadge(){if(!SYNC_OK||!sync.key)return '';return {busy:'⏳',ok:'☁️✓',err:'☁️⚠️',idle:'☁️'}[sync.status]||'☁️'}

/* ---------- Тест ---------- */
const MODE_HINT={zh2m:'Что означает?',m2zh:'Выберите иероглифы',listen:'🎧 Что вы слышите?',cloze:'📝 Какое слово пропущено?',tone:'🎵 Какие тоны?',type:'⌨️ Напишите пиньинь с тонами',write:'✍️ Напишите иероглиф',conf:'⚖️ Какое слово подходит?'};
function mixedPick(){const arr=['zh2m','m2zh','cloze','cloze','tone','m2zh'];if(TTS)arr.push('listen','listen');return arr[Math.floor(Math.random()*arr.length)]}
function pickMode(){
  if(!['mixed','zh2m','m2zh','listen'].includes(store.settings.mode))store.settings.mode='mixed';
  const m=store.settings.mode;
  if(m==='mixed')return mixedPick();
  if(m==='listen'&&!TTS)return 'zh2m';
  return m;
}
function startLevelQuiz(id){sheet=null;startQuiz(LEVELS[id].words,`${LEVELS[id].i} ${LEVELS[id].t}`,id);Q.back='levels'}
function startReview(){startQuiz(dueWords().slice(0,20),'🔁 Повторение',null)}
function startQuiz(words,title,levelId,daily,forced){
  if(!words.length)return;
  Q={kind:'words',drill:forced==='mix'?'weak':forced||null,daily:!!daily,items:shuffle(words.slice()).map(w=>({w,m:forced==='mix'?mixedPick():forced||pickMode()})),i:0,title,levelId,first:{},answered:false,combo:0,maxCombo:0,xp:0,total:words.length,done:0,wrong:[],wrongConf:[]};
  screen='quiz';render();window.scrollTo(0,0);autoPlayPrompt();
}
function autoPlayPrompt(){const it=Q&&Q.items[Q.i];if(it&&(it.m==='listen'||it.m==='tone')&&!Q.answered)setTimeout(()=>speak(it.w.hz),300)}
function prepItem(it){
  if(it.ready)return;it.ready=true;const w=it.w;
  if(it.m==='cloze'&&!(w.ex&&w.ex.includes(w.hz)))it.m='zh2m';
  if((it.m==='type'||it.m==='tone')&&!segOf(w))it.m='zh2m';
  if(it.m==='tone'){const t=toneOptions(w);if(!t){it.m='zh2m'}else{it.opts=t.opts;it.correct=t.correct}}
  if(['zh2m','m2zh','listen','cloze'].includes(it.m))it.opts=shuffle([w,...distractors(w,3)]);
}
function isRight(it,o){return it.m==='tone'?o===it.correct:it.m==='conf'?o===it.a:o===it.w}
const blankify=(s,hz)=>s.split(hz).join('<span class="blank">＿＿</span>');
function renderQuiz(){
  const it=Q.items[Q.i];prepItem(it);const w=it.w,st=store.settings,A=Q.answered;
  const c=colorize(w);
  let prompt='',body='';
  const sp=(t,r)=>`speak(${JSON.stringify(t).replace(/"/g,'&quot;')}${r?','+r:''})`;
  if(it.m==='zh2m'){prompt=`<div class="bighz hz">${A?c.hz:w.hz}</div><div class="py">${(st.showPinyin||A)?c.py:''}</div>`}
  else if(it.m==='m2zh'){prompt=`<div class="meaning" style="font-size:28px">${meaningHTML(w)}</div>`}
  else if(it.m==='listen'){prompt=`<button class="speak" onclick="speak('${w.hz}')">🔊</button><div class="subbtns"><button class="iconbtn" onclick="speak('${w.hz}',0.5)">🐢 медленно</button></div>`}
  else if(it.m==='cloze'){prompt=`<div class="sent hz">${A?w.ex.split(w.hz).join(`<mark>${w.hz}</mark>`):blankify(w.ex,w.hz)}</div><div class="trl">${A||it.showTr?w.exru:`<button class="linkbtn" onclick="Q.items[Q.i].showTr=true;render()">показать перевод</button>`}</div>`}
  else if(it.m==='tone'){prompt=`<div class="bighz hz">${A?c.hz:w.hz}</div><div class="subbtns"><button class="iconbtn" onclick="speak('${w.hz}')">🔊 ещё раз</button><button class="iconbtn" onclick="speak('${w.hz}',0.5)">🐢</button></div>`}
  else if(it.m==='type'){prompt=`<div class="bighz hz">${A?c.hz:w.hz}</div><div class="trl">${meaningHTML(w)}</div>`;
    body=`<div class="typebox"><input id="pyInput" class="inp" placeholder="например: ni3hao3 или nǐhǎo" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${A?'disabled':''} value="${(it.typed||'').replace(/"/g,'&quot;')}" onkeydown="if(event.key==='Enter'){event.preventDefault();checkTyped()}"><button class="btn" onclick="checkTyped()" ${A?'disabled':''}>Проверить</button></div><div class="note" style="text-align:center">Цифра после слога — тон (1–4), лёгкий тон можно не писать, ü = v</div>`}
  else if(it.m==='write'){prompt=`<div class="meaning" style="font-size:24px">${meaningHTML(w)}</div><div class="py">${c.py}</div>`;
    body=A?'':`<div class="hwwrap"><div id="hw" class="hwbox"></div><div id="hwProg" class="note" style="text-align:center"></div><div class="subbtns"><button class="iconbtn" onclick="hwHint()">💡 подсказка</button><button class="iconbtn" onclick="hwGiveUp()">🙈 не помню</button><button class="iconbtn" onclick="speak('${w.hz}')">🔊</button></div></div>`}
  else if(it.m==='conf'){prompt=`<div class="sent hz">${A?it.q.replace('＿＿',`<mark>${it.a}</mark>`):it.q.replace('＿＿','<span class="blank">＿＿</span>')}</div><div class="trl">${A||it.showTr?it.ru:`<button class="linkbtn" onclick="Q.items[Q.i].showTr=true;render()">показать перевод</button>`}</div>`}
  const optLabel=o=>{
    if(it.m==='zh2m')return meaningHTML(o);
    if(it.m==='tone')return `<span class="pyopt">${o}</span>`;
    if(it.m==='conf')return `<span class="hz">${o}</span>${(st.showPinyin||A)?`<small>${confPy(o)}</small>`:''}`;
    const showPy=((it.m==='m2zh'||it.m==='cloze')&&st.showPinyin)||A;
    return `<span class="hz">${o.hz}</span>${showPy?`<small>${o.py}${(it.m==='listen'||it.m==='cloze')&&A?' · '+o.ru:''}</small>`:''}`;
  };
  if(it.opts){const optCls=it.m==='zh2m'||it.m==='tone'?'':'hzopt';
    body=`<div class="opts">${it.opts.map((o,k)=>{let cls='opt '+optCls;if(A){if(isRight(it,o))cls+=' right';else if(k===it.chosen)cls+=' wrong'}
      return `<button class="${cls}" ${A?'disabled':''} onclick="answer(${k})"><span class="num">${k+1}</span>${optLabel(o)}</button>`}).join('')}</div>`}
  let rv='';
  if(A){
    const ok=it.ok;
    const verdict=ok?['✓ Верно!','✓ 对了！','✓ 太棒了！','✓ 没错！'][Math.floor(Math.random()*4)]:(it.m==='conf'?'✗ Не совсем — вопрос вернётся чуть позже':'✗ Не совсем — слово вернётся чуть позже');
    let extra='';
    if(it.m==='type'&&!ok)extra=`<div class="note">Вы написали: <b>${(it.typed||'').replace(/[<>&]/g,'')}</b> · правильно: <b>${numericPy(w.py,segOf(w))}</b>${it.letters?' — буквы верные, ошиблись в тонах':''}</div>`;
    if(it.m==='conf'){
      rv=`<div class="reveal"><div class="verdict ${ok?'ok':'no'}">${verdict}</div>
        <div class="pairw">${it.pair.w.map(([h,py])=>`<span class="hz">${h}</span> <small>${py}</small>`).join('<span class="vs">vs</span>')}</div>
        <div class="paire">${it.pair.e}</div>
        <div class="nextrow"><span class="kbd">Enter ↵</span><button class="btn" id="nextBtn" onclick="next()">Дальше →</button></div></div>`;
    }else{
      rv=`<div class="reveal">
        <div class="verdict ${ok?'ok':'no'}">${verdict}</div>${extra}
        <div class="rv-head">
          <div class="rv-hz hz">${c.hz}</div>
          <div><div class="rv-py">${c.py}</div><div class="rv-m">${w.ru} <span class="en">· ${w.en}</span></div></div>
          <div style="margin-left:auto" class="row"><button class="iconbtn" onclick="speak('${w.hz}')">🔊</button><button class="iconbtn" onclick="speak('${w.hz}',0.5)">🐢</button><button class="iconbtn" onclick="hwAnimate('${w.hz}','hwAnim')" title="Порядок черт">✍️</button></div>
        </div>
        <div id="hwAnim" class="hwanim"></div>
        ${exampleHTML(w)}
        <div class="nextrow"><span class="kbd">Enter ↵</span><button class="btn" id="nextBtn" onclick="next()">Дальше →</button></div>
      </div>`;
    }
  }
  app.innerHTML=`
  <div class="qtop">
    <button class="iconbtn" onclick="exitQuiz()">✕</button>
    <div class="bar"><i style="width:${Q.done/Q.total*100}%"></i></div>
    <span class="kbd">${Q.done}/${Q.total}</span>
    <button class="iconbtn ${st.showPinyin?'on':''}" onclick="togglePinyin()" title="Пиньинь (P)">拼</button>
  </div>
  <div class="qcard">
    <div class="qhint">${Q.title} · ${MODE_HINT[it.m]}</div>
    ${Q.combo>=3?`<div class="combo">🔥 ×${Q.combo}</div>`:''}
    ${prompt}
  </div>
  ${body}
  ${rv}`;
  if(A){const b=document.getElementById('nextBtn');if(b&&window.innerWidth<700)b.scrollIntoView({behavior:'smooth',block:'end'});if(it.m==='write')hwAnimate(w.hz,'hwAnim')}
  else if(it.m==='type'){const i=document.getElementById('pyInput');if(i)i.focus()}
  else if(it.m==='write')startWriting();
}
function togglePinyin(){if(Q&&Q.items[Q.i]&&Q.items[Q.i].m==='write'&&!Q.answered)return;store.settings.showPinyin=!store.settings.showPinyin;save();render()}
function answer(k){
  if(!Q||Q.answered)return;const it=Q.items[Q.i];if(!it.opts||k>=it.opts.length)return;
  it.chosen=k;settle(isRight(it,it.opts[k]));
}
function settle(ok){
  const it=Q.items[Q.i];it.ok=ok;Q.answered=true;
  const key=it.key||it.w.hz;const first=!(key in Q.first);
  if(first){Q.first[key]=ok;if(it.m!=='conf')srsUpdate(it.w,ok)}
  if(ok){Q.done++;Q.combo++;Q.maxCombo=Math.max(Q.maxCombo,Q.combo);Q.xp+=first?10+(Q.combo>=3?5:0)+(['type','write'].includes(it.m)?5:0):3}
  else{Q.combo=0;
    if(it.m==='conf'){if(!Q.wrongConf.includes(it.key))Q.wrongConf.push(it.key)}else if(!Q.wrong.includes(it.w))Q.wrong.push(it.w);
    const pos=Math.min(Q.i+3+Math.floor(Math.random()*2),Q.items.length);
    const nm={zh2m:'m2zh',m2zh:'zh2m'}[it.m]||it.m;
    Q.items.splice(pos,0,it.m==='conf'?{m:'conf',key:it.key,q:it.q,a:it.a,ru:it.ru,pair:it.pair,opts:shuffle(it.opts.slice()),w:it.w}:{w:it.w,m:nm});}
  render();
  if(it.m==='cloze')speak(it.w.ex,0.85);
  else if(it.m==='conf')speak(it.q.replace('＿＿',it.a),0.85);
  else if(store.settings.autoAudio&&!['listen','tone'].includes(it.m))speak(it.w.hz);
  else if(['listen','tone'].includes(it.m)&&!ok)speak(it.w.hz);
}
function next(){
  if(!Q||!Q.answered)return;
  Q.i++;Q.answered=false;hwState=null;
  if(Q.i>=Q.items.length)return finish();
  render();window.scrollTo(0,0);autoPlayPrompt();
}
function finish(){
  const firstOk=Object.values(Q.first).filter(Boolean).length;
  const acc=Math.round(firstOk/Q.total*100);
  const st=acc>=90?3:acc>=75?2:acc>=50?1:0;
  if(Q.levelId!==null){const prev=store.levels[Q.levelId]||{best:0,acc:0};store.levels[Q.levelId]={best:Math.max(prev.best,st),acc:Math.max(prev.acc,acc)}}
  if(Q.daily){const t=todayStr(),prev=store.daily[t];store.daily[t]={acc:Math.max(acc,prev?prev.acc:0)};}
  store.xp+=Q.xp;bumpStreak();save();
  Q.result={acc,st,firstOk};screen='result';render();window.scrollTo(0,0);
  if(sync.key)syncNow();
}
function renderResult(){
  const r=Q.result;const lid=Q.levelId;const conf=Q.kind==='conf';
  const msg=r.st===3?'太棒了！Отлично!':r.st===2?'很好！Хорошо!':r.st===1?'不错，继续加油！Неплохо, продолжайте!':'加油！Попробуйте ещё раз';
  const cid=conf?+String(lid).slice(1):null;
  const nextId=conf?(cid<CONF_SETS.length-1?cid+1:null):(lid!==null&&lid<LEVELS.length-1?lid+1:null);
  const confWrong=conf?Q.wrongConf.map(k=>{const [ci,pi,qi]=k.slice(1).split('-').map(Number);const p=CONF_SETS[ci].pairs[pi];const [q,a,ru]=p.q[qi];return `<div class="mitem"><div class="info"><div class="hz" style="font-size:18px">${q.replace('＿＿',`<mark>${a}</mark>`)}</div><div style="color:var(--muted)">${ru}</div></div></div>`}).join(''):'';
  app.innerHTML=`
  <div class="panel result">
    <div class="kbd">${Q.title}</div>
    <div class="bigstars">${stars(r.st,'').replace('class=""','')}</div>
    <div class="big">${r.acc}%</div>
    <div style="font-weight:600">${msg}</div>
    <div class="row" style="justify-content:center;margin-top:10px;gap:8px">
      <span class="stat">С первой попытки: <b>${r.firstOk}/${Q.total}</b></span>
      <span class="stat">⭐ +<b>${Q.xp}</b> XP</span>
      <span class="stat">🔥 Лучшая серия: <b>${Q.maxCombo}</b></span>
    </div>
    ${conf?'':'<div class="note">Слова уровня добавлены в повторение. Полоска уровня заполняется постепенно: слово становится «выученным», когда вы правильно ответите на него в разные дни.</div>'}
    ${confWrong?`<div class="mlist"><div class="lbl" style="margin-top:14px">Где были ошибки</div>${confWrong}</div>`:''}
    ${Q.wrong.length?`<div class="mlist"><div class="lbl" style="margin-top:14px">Слова с ошибками — попадут в повторение</div>
      ${Q.wrong.map(w=>{const c=colorize(w);return `<div class="mitem"><div class="hz">${c.hz}</div><div class="info"><div>${c.py}</div><div style="color:var(--muted)">${w.ru} · ${w.en}</div></div><button class="iconbtn" onclick="speak('${w.hz}')">🔊</button></div>`}).join('')}</div>`:''}
    <div class="row" style="justify-content:center;margin-top:18px;gap:8px">
      <button class="btn ghost" onclick="exitQuiz()">${Q.back==='drills'?'К тренировкам':Q.back==='levels'?'К уровням':'На главную'}</button>
      ${Q.drill?`<button class="btn" onclick="startDrill('${Q.drill}')">↻ Ещё подход</button>`:''}
      ${conf?`<button class="btn ghost" onclick="startConfQuiz(${cid})">↻ Ещё раз</button>`:lid!==null?`<button class="btn ghost" onclick="startLevelQuiz(${lid})">↻ Ещё раз</button>`:''}
      ${nextId!==null?(conf?`<button class="btn" onclick="Q=null;screen='drills';openConf(${nextId})">Набор ${nextId+1} →</button>`:`<button class="btn" onclick="openNext(${nextId})">Уровень ${nextId+1} →</button>`):''}
    </div>
  </div>`;
}
function openNext(id){screen='levels';Q=null;sheet=id;render();window.scrollTo(0,0)}

/* ---------- Клавиатура ---------- */
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target&&e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if(screen==='quiz'&&Q){
    if(/^[1-4]$/.test(k)&&!Q.answered){answer(+k-1);e.preventDefault()}
    else if((k==='enter'||k===' ')&&Q.answered){next();e.preventDefault()}
    else if(k==='p'||k==='з'){togglePinyin()}
    else if((k==='r'||k==='к')&&!['type','conf'].includes(Q.items[Q.i].m)){speak(Q.items[Q.i].w.hz)}
    else if(k==='escape'){exitQuiz()}
  }else if(screen==='study'&&S){
    if(k===' '||k==='enter'){flip();e.preventDefault()}
    else if(k==='arrowright')studyMove(1);
    else if(k==='arrowleft')studyMove(-1);
    else if(k==='r'||k==='к')speak(S.words[S.i].hz);
    else if(k==='escape'){S=null;openScreen('levels')}
  }else if((screen==='levels'||screen==='drills')&&sheet!==null&&k==='escape'){closeSheet()}
  else if(screen==='result'&&k==='enter'){exitQuiz()}
});

render();
if(sync.key)syncNow();
</script>
