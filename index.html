<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汉字卡片 · Карточки HSK 4–5</title>
<style>
:root{
  --bg:#f6f1e8;--card:#fffdf8;--ink:#2a2420;--muted:#8a7e72;--line:#e7ddcd;
  --red:#c63a2f;--red-d:#a32c22;--good:#2e8b57;--good-bg:#e5f4ea;--bad:#c63a2f;--bad-bg:#fbe7e4;--gold:#d79b1d;
  --t1:#d0342c;--t2:#e08600;--t3:#2c9a4c;--t4:#2b6ad0;--t5:#9a9086;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased}
.hz{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.seal{width:46px;height:46px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:24px;box-shadow:var(--shadow)}
.brand h1{font-size:20px;margin:0}
.brand p{margin:0;color:var(--muted);font-size:13px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.stat b{font-variant-numeric:tabular-nums}
/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.seg{display:inline-flex;background:#f1e9dc;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-size:13px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;user-select:none;cursor:pointer}
.sw{width:38px;height:22px;border-radius:999px;background:#d9cebd;position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on .sw{background:var(--red)}
.toggle.on .sw::after{left:19px}
.review{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.review h3{margin:0 0 2px;font-size:16px}
.review p{margin:0;color:var(--muted);font-size:13px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;background:var(--red);color:#fff;transition:.15s}
.btn:hover{background:var(--red-d)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#f1e9dc}
.btn.small{padding:7px 12px;font-size:13px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
/* levels */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lvl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;transition:.15s;position:relative;box-shadow:var(--shadow)}
.lvl:hover{transform:translateY(-2px);border-color:#d6c6ae}
.lvl .n{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em}
.lvl .ic{font-size:26px;position:absolute;right:12px;top:10px}
.lvl .t{font-weight:700;margin-top:4px;font-size:15px;padding-right:32px}
.lvl .z{color:var(--red);font-size:15px}
.bar{height:6px;background:#efe6d8;border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:99px;transition:width .3s}
.lvl .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.stars{color:var(--gold);letter-spacing:1px}
.stars .off{color:#dccfbb}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(40,25,10,.35);display:grid;place-items:center;padding:16px;z-index:10}
.sheet{background:var(--card);border-radius:18px;padding:20px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet h2{margin:0 0 2px}
.sheet .words{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.chip{background:#f3ebde;border-radius:8px;padding:3px 8px;font-size:15px}
.sheet .acts{display:grid;gap:8px}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qtop .bar{flex:1;margin:0;height:8px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-size:14px}
.iconbtn.on{background:var(--red);color:#fff;border-color:var(--red)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 20px;box-shadow:var(--shadow);text-align:center;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative}
.qhint{position:absolute;top:12px;left:16px;font-size:12px;color:var(--muted)}
.combo{position:absolute;top:12px;right:16px;font-size:13px;color:var(--gold);font-weight:700}
.bighz{font-size:clamp(54px,12vw,92px);line-height:1.1}
.py{font-size:20px;color:var(--muted);min-height:28px}
.meaning{font-size:24px;font-weight:600}
.meaning small,.opt small{display:block;font-size:.72em;font-weight:400;color:var(--muted)}
.speak{border:0;background:var(--red);color:#fff;width:96px;height:96px;border-radius:50%;font-size:40px;box-shadow:0 8px 24px rgba(198,58,47,.35)}
.speak:active{transform:scale(.96)}
.subbtns{display:flex;gap:8px;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 14px 14px 46px;text-align:left;position:relative;min-height:62px;font-size:17px;transition:.12s}
.opt:hover:not(:disabled){border-color:#cdb99b;background:#fffaf0}
.opt .num{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:7px;background:#f1e9dc;font-size:12px;display:grid;place-items:center;color:var(--muted);font-weight:700}
.opt.hzopt{font-size:28px}
.opt.hzopt small{font-size:14px}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.reveal{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rv-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rv-hz{font-size:44px}
.rv-py{font-size:20px}
.rv-m{font-size:16px}
.rv-m .en{color:var(--muted)}
.ex{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.ex .zh{font-size:20px}
.ex .ru{color:var(--muted);font-size:14px;margin-top:2px}
mark{background:#fde6b8;color:inherit;border-radius:4px;padding:0 2px}
.verdict{font-weight:700;margin-bottom:8px}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.nextrow{display:flex;justify-content:flex-end;margin-top:12px;gap:8px;align-items:center}
.kbd{font-size:11px;color:var(--muted)}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
/* study */
.flash{perspective:1200px;margin:6px 0 14px}
.flash-inner{position:relative;min-height:330px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;gap:8px}
.face.back{transform:rotateY(180deg)}
.face .tap{position:absolute;bottom:12px;font-size:12px;color:var(--muted)}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
/* result */
.result{text-align:center}
.result .big{font-size:56px;margin:4px 0}
.result .bigstars{font-size:40px;color:var(--gold);letter-spacing:4px}
.result .bigstars .off{color:#dccfbb}
.mlist{text-align:left;margin-top:12px}
.mitem{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.mitem .hz{font-size:24px;min-width:70px}
.mitem .info{flex:1;font-size:14px}
.legend{display:flex;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:8px}
.footer{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

const LEVELS = RAW.map((L,id)=>({id,t:L.t,z:L.z,i:L.i,words:L.w.trim().split('\n').map(line=>{
  const [hz,py,ru,en,ex,exru]=line.split('|').map(s=>s.trim());
  return {hz,py,ru,en,ex,exru,lvl:id};
})}));
const ALL = LEVELS.flatMap(l=>l.words);

const LS_KEY='hanzi-cards-hsk45-v1';
const DEF_SETTINGS={lang:'both',showPinyin:false,mode:'mixed',autoAudio:true};
let store={srs:{},levels:{},xp:0,streak:{last:null,count:0},settings:{...DEF_SETTINGS}};
try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(s){store=Object.assign(store,s);store.settings=Object.assign({...DEF_SETTINGS},s.settings||{});}}catch(e){}
let storageOK=true;
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(store));storageOK=localStorage.getItem(LS_KEY)!==null}catch(e){storageOK=false}}
try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){storageOK=false}

/* ================== ИНТЕРВАЛЬНОЕ ПОВТОРЕНИЕ (Лейтнер) ================== */
const INTERVALS=[0,1,3,7,14,30,60]; // дни для коробок 0..6
const DAY=864e5;
function srs(w){return store.srs[w.hz]}
function srsUpdate(w,ok){
  const r=store.srs[w.hz]||{b:0,d:0,c:0,x:0};
  if(ok){r.c++;
    // повышаем этап, только если слово новое или уже пора повторять (интервалы работают по дням)
    if(r.b===0||r.d<=Date.now()){r.b=Math.min(r.b+1,6);r.d=Date.now()+INTERVALS[r.b]*DAY;}}
  else{r.b=0;r.x++;r.d=Date.now();}
  store.srs[w.hz]=r;save();
}
function isMastered(w){const r=srs(w);return !!(r&&r.b>=3)}
function isStarted(w){const r=srs(w);return !!(r&&r.c>0)}
function levelProgress(l){return l.words.reduce((a,w)=>{const r=srs(w);return a+(r?(r.c>0?1:0)+Math.min(r.b,3):0)},0)/(l.words.length*4)}
function dueWords(){const now=Date.now();return ALL.filter(w=>{const r=srs(w);return r&&r.d<=now}).sort((a,b)=>srs(a).b-srs(b).b)}

const VOW='aāáǎàeēéěèiīíǐìoōóǒòuūúǔùüǖǘǚǜ';
const TONE={};'āēīōūǖ'.split('').forEach(c=>TONE[c]=1);'áéíóúǘ'.split('').forEach(c=>TONE[c]=2);'ǎěǐǒǔǚ'.split('').forEach(c=>TONE[c]=3);'àèìòùǜ'.split('').forEach(c=>TONE[c]=4);
const INITS=['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s','y','w'];
const SEP=/[\s'’\-]/;
const segCache={};
function segment(py,n){
  const key=py+'#'+n; if(key in segCache)return segCache[key];
  const s=py.toLowerCase();
  function rec(pos,acc){
    while(pos<s.length&&SEP.test(s[pos]))pos++;
    if(pos>=s.length)return acc.length===n?acc:null;
    if(acc.length>=n)return null;
    const boundary=pos===0||SEP.test(s[pos-1]);
    const opts=INITS.filter(i=>s.startsWith(i,pos));if(boundary)opts.push('');
    for(const ini of opts){
      const p=pos+ini.length;let q=p;while(q<s.length&&VOW.includes(s[q]))q++;
      if(q===p)continue;
      for(const fin of ['ng','n','r','']){
        if(fin&&!s.startsWith(fin,q))continue;
        if(fin==='r'&&!(ini===''&&/^[eēéěè]$/.test(s.slice(p,q))))continue;
        const end=q+fin.length;
        const r=rec(end,acc.concat([[pos,end]]));if(r)return r;
      }
    }
    return null;
  }
  const res=rec(0,[]);
  const out=res?res.map(([a,b])=>{let t=5;for(const c of s.slice(a,b))if(TONE[c]){t=TONE[c];break}return {a,b,t}}):null;
  segCache[key]=out;return out;
}
const isHan=c=>/[一-鿿]/.test(c);
function colorize(w){
  const hzChars=[...w.hz];const n=hzChars.filter(isHan).length;
  const seg=segment(w.py,n);
  if(!seg)return {hz:w.hz,py:w.py};
  let k=0;const hz=hzChars.map(c=>isHan(c)?`<span class="t${seg[k++].t}">${c}</span>`:c).join('');
  let py='',last=0;seg.forEach(({a,b,t})=>{py+=w.py.slice(last,a)+`<span class="t${t}">${w.py.slice(a,b)}</span>`;last=b});py+=w.py.slice(last);
  return {hz,py};
}

/* ================== ОЗВУЧКА ================== */
const TTS='speechSynthesis' in window;
let zhVoice=null,voicesLoaded=false;
function loadVoices(){if(!TTS)return;const vs=speechSynthesis.getVoices();if(vs.length)voicesLoaded=true;zhVoice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang)&&!/HK|TW/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;}
if(TTS){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(screen==='home')render()};}
function speak(text,rate){if(!TTS)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';if(zhVoice)u.voice=zhVoice;u.rate=rate||0.85;speechSynthesis.speak(u);}catch(e){}}

/* ================== УТИЛИТЫ ================== */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stars(n,cls){let s='';for(let i=0;i<3;i++)s+=i<n?'★':`<span class="off">★</span>`;return `<span class="${cls||'stars'}">${s}</span>`}
function meaningHTML(w){const L=store.settings.lang;if(L==='ru')return w.ru;if(L==='en')return w.en;return `${w.ru}<small>${w.en}</small>`}
function exampleHTML(w){const zh=w.ex.split(w.hz).join(`<mark>${w.hz}</mark>`);return `<div class="ex"><div class="row" style="gap:8px;align-items:flex-start"><button class="iconbtn" onclick="speak(${JSON.stringify(w.ex).replace(/"/g,'&quot;')},0.8)" title="Озвучить пример">🔊</button><div style="flex:1;text-align:left"><div class="zh hz">${zh}</div><div class="ru">${w.exru}</div></div></div></div>`}
function distractors(w,k){
  let pool=shuffle(LEVELS[w.lvl].words.filter(x=>x!==w));
  if(pool.length<k)pool=pool.concat(shuffle(ALL.filter(x=>x!==w&&!pool.includes(x))));
  return pool.slice(0,k);
}
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function bumpStreak(){const t=todayStr();if(store.streak.last===t)return;const y=new Date(Date.now()-DAY);store.streak.count=store.streak.last===todayStr(y)?store.streak.count+1:1;store.streak.last=t;save();}
function currentStreak(){const t=todayStr(),y=todayStr(new Date(Date.now()-DAY));return (store.streak.last===t||store.streak.last===y)?store.streak.count:0}

/* ================== ЭКРАНЫ ================== */
const app=document.getElementById('app');
let screen='home',sheet=null,Q=null,S=null;

function render(){
  if(screen==='home')renderHome();
  else if(screen==='quiz')renderQuiz();
  else if(screen==='study')renderStudy();
  else if(screen==='result')renderResult();
}

function setSetting(k,v){store.settings[k]=v;save();render()}

function renderHome(){
  const st=store.settings;
  const mastered=ALL.filter(isMastered).length;
  const due=dueWords();
  const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${st[key]===v?'on':''}" onclick="setSetting('${key}','${v}')">${l}</button>`).join('')}</div>`;
  const noZh=TTS&&voicesLoaded&&!zhVoice;
  let rec=LEVELS.findIndex(l=>!(store.levels[l.id]&&store.levels[l.id].best>=2));
  app.innerHTML=`
  <div class="top">
    <div class="brand"><div class="seal hz">汉</div><div><h1>汉字卡片 · Карточки</h1><p>Лексика HSK 4–5 · ${LEVELS.length} уровней · ${ALL.length} слов</p></div></div>
    <div class="stats">
      <span class="stat">✏️ Изучается <b>${ALL.filter(isStarted).length}</b></span>
      <span class="stat">📚 Выучено <b>${mastered}</b>/${ALL.length}</span>
      <span class="stat">⭐ <b>${store.xp}</b> XP</span>
      <span class="stat">🔥 <b>${currentStreak()}</b> дн.</span>
    </div>
  </div>

  <div class="panel review">
    <div><h3>🔁 Повторение</h3><p>${due.length?`Пора повторить слов: <b>${due.length}</b>. Ошибки возвращаются сразу, выученные слова — через 1, 3, 7, 14, 30 дней.`:'Сейчас повторять нечего. Пройдите уровень — слова попадут в интервальное повторение.'}</p></div>
    <button class="btn" ${due.length?'':'disabled'} onclick="startReview()">Повторить${due.length?' ('+Math.min(due.length,20)+')':''}</button>
  </div>

  <div class="panel">
    <div class="row" style="gap:22px;align-items:flex-start">
      <div><div class="lbl">Режим теста</div>${seg('mode',[['mixed','🎲 Микс'],['zh2m','汉 → смысл'],['m2zh','смысл → 汉'],['listen','🎧 Аудирование']])}</div>
      <div><div class="lbl">Перевод</div>${seg('lang',[['both','RU + EN'],['ru','RU'],['en','EN']])}</div>
      <div><div class="lbl">Подсказки</div>
        <div class="row" style="gap:16px">
          <span class="toggle ${st.showPinyin?'on':''}" onclick="setSetting('showPinyin',${!st.showPinyin})"><span class="sw"></span>Пиньинь виден</span>
          <span class="toggle ${st.autoAudio?'on':''}" onclick="setSetting('autoAudio',${!st.autoAudio})"><span class="sw"></span>Автоозвучка</span>
        </div>
      </div>
    </div>
    ${!storageOK?'<div class="note" style="color:var(--bad)">⚠️ Этот браузер не даёт сохранять прогресс (приватный режим или встроенный браузер мессенджера). Откройте ссылку в обычном Safari/Chrome.</div>':''}
    ${!TTS?'<div class="note">⚠️ Браузер не поддерживает озвучку — аудирование заменится обычным режимом.</div>':noZh?'<div class="note">⚠️ В системе не найден китайский голос — озвучка может звучать неправильно. Установите китайский язык/голос в настройках ОС или откройте в Chrome/Safari.</div>':''}
    <div class="legend">Цвет тонов: <span class="t1">1-й ā</span><span class="t2">2-й á</span><span class="t3">3-й ǎ</span><span class="t4">4-й à</span><span class="t5">лёгкий</span> · Клавиши: 1–4 ответ, Enter — далее, P — пиньинь, R — озвучить</div>
  </div>

  <div class="grid">
    ${LEVELS.map(l=>{const m=l.words.filter(isMastered).length;const sd=l.words.filter(isStarted).length;const best=(store.levels[l.id]||{}).best||0;
      return `<button class="lvl" onclick="openSheet(${l.id})">
        <div class="n">УРОВЕНЬ ${l.id+1}${l.id===rec?' · <span style="color:var(--red)">ДАЛЕЕ</span>':''}</div>
        <div class="ic">${l.i}</div>
        <div class="t">${l.t}</div>
        <div class="z hz">${l.z}</div>
        <div class="bar"><i style="width:${levelProgress(l)*100}%"></i></div>
        <div class="meta"><span>${sd?`${sd}/${l.words.length} изучается · ${m} выучено`:'не начат'}</span>${stars(best)}</div>
      </button>`}).join('')}
  </div>
  <div class="footer">Прогресс сохраняется в этом браузере. Слово считается выученным после правильных ответов в разные дни (через 1 и 3 дня) — так работает интервальное повторение.</div>
  ${sheet!==null?sheetHTML(sheet):''}`;
}

function sheetHTML(id){
  const l=LEVELS[id];const r=store.levels[id];
  return `<div class="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet">
    <div class="n" style="font-size:12px;color:var(--muted);font-weight:600">УРОВЕНЬ ${id+1} ${r?'· лучший результат '+r.acc+'%':''}</div>
    <h2>${l.i} ${l.t} <span class="hz" style="color:var(--red)">${l.z}</span></h2>
    <div class="words">${l.words.map(w=>`<span class="chip hz" style="${isMastered(w)?'background:#cfeedb':isStarted(w)?'background:#fbeac4':''}">${w.hz}</span>`).join('')}</div>
    <div class="acts">
      <button class="btn ghost" onclick="startStudy(${id})">📖 Карточки — сначала изучить</button>
      <button class="btn" onclick="startLevelQuiz(${id})">🎯 Тест</button>
      <button class="btn ghost small" onclick="closeSheet()">Закрыть</button>
    </div></div></div>`;
}
function openSheet(id){sheet=id;render()}
function closeSheet(){sheet=null;render()}
function goHome(){if(TTS)speechSynthesis.cancel();screen='home';sheet=null;Q=null;S=null;render();window.scrollTo(0,0)}

/* ---------- Изучение (флеш-карточки) ---------- */
function startStudy(id){sheet=null;S={id,i:0,flip:false,words:LEVELS[id].words};screen='study';render();window.scrollTo(0,0)}
function renderStudy(){
  const w=S.words[S.i];const c=colorize(w);const st=store.settings;
  app.innerHTML=`
  <div class="qtop">
    <button class="iconbtn" onclick="goHome()">← Назад</button>
    <div class="bar"><i style="width:${(S.i+1)/S.words.length*100}%"></i></div>
    <span class="kbd">${S.i+1}/${S.words.length}</span>
  </div>
  <div class="flash ${S.flip?'flipped':''}">
    <div class="flash-inner" onclick="flip()">
      <div class="face">
        <div class="bighz hz">${w.hz}</div>
        <div class="py">${st.showPinyin?c.py:''}</div>
        <div class="tap">нажмите или пробел, чтобы перевернуть</div>
      </div>
      <div class="face back">
        <div class="bighz hz" style="font-size:clamp(44px,9vw,70px)">${c.hz}</div>
        <div class="rv-py">${c.py}</div>
        <div class="meaning">${meaningHTML(w)}</div>
        <div style="max-width:560px;width:100%" onclick="event.stopPropagation()">${exampleHTML(w)}</div>
      </div>
    </div>
  </div>
  <div class="ctrl">
    <button class="btn ghost" onclick="studyMove(-1)" ${S.i===0?'disabled':''}>← Пред.</button>
    <div class="row" style="gap:8px">
      <button class="iconbtn" onclick="speak('${w.hz}')">🔊</button>
      <button class="iconbtn" onclick="speak('${w.hz}',0.5)" title="Медленно">🐢</button>
    </div>
    ${S.i<S.words.length-1?`<button class="btn ghost" onclick="studyMove(1)">След. →</button>`:`<button class="btn" onclick="startLevelQuiz(${S.id})">🎯 К тесту</button>`}
  </div>`;
}
function flip(){S.flip=!S.flip;render();if(S.flip&&store.settings.autoAudio)speak(S.words[S.i].hz)}
function studyMove(d){S.i=Math.max(0,Math.min(S.words.length-1,S.i+d));S.flip=false;render();if(store.settings.autoAudio)speak(S.words[S.i].hz)}

/* ---------- Тест ---------- */
function pickMode(){
  const m=store.settings.mode;
  if(m==='mixed'){const arr=['zh2m','m2zh','zh2m','m2zh'];if(TTS)arr.push('listen','listen');return arr[Math.floor(Math.random()*arr.length)]}
  if(m==='listen'&&!TTS)return 'zh2m';
  return m;
}
function startLevelQuiz(id){sheet=null;startQuiz(LEVELS[id].words,`${LEVELS[id].i} ${LEVELS[id].t}`,id)}
function startReview(){startQuiz(dueWords().slice(0,20),'🔁 Повторение',null)}
function startQuiz(words,title,levelId){
  if(!words.length)return;
  Q={items:shuffle(words.slice()).map(w=>({w,m:pickMode()})),i:0,title,levelId,first:{},answered:false,combo:0,maxCombo:0,xp:0,total:words.length,done:0,wrong:[]};
  screen='quiz';render();window.scrollTo(0,0);autoPlayPrompt();
}
function autoPlayPrompt(){const it=Q&&Q.items[Q.i];if(it&&it.m==='listen'&&!Q.answered)setTimeout(()=>speak(it.w.hz),300)}
function modeHint(m){return {zh2m:'Что означает?',m2zh:'Выберите иероглифы',listen:'🎧 Что вы слышите?'}[m]}
function renderQuiz(){
  const it=Q.items[Q.i],w=it.w,st=store.settings;
  if(!it.opts)it.opts=shuffle([w,...distractors(w,3)]);
  const c=colorize(w);
  let prompt='';
  if(it.m==='zh2m'){prompt=`<div class="bighz hz">${Q.answered?c.hz:w.hz}</div><div class="py">${(st.showPinyin||Q.answered)?c.py:''}</div>`}
  else if(it.m==='m2zh'){prompt=`<div class="meaning" style="font-size:28px">${meaningHTML(w)}</div>`}
  else{prompt=`<button class="speak" onclick="speak('${w.hz}')">🔊</button><div class="subbtns"><button class="iconbtn" onclick="speak('${w.hz}',0.5)">🐢 медленно</button></div>`}
  const optLabel=o=>{
    if(it.m==='zh2m')return meaningHTML(o);
    const showPy=(it.m==='m2zh'&&st.showPinyin)||Q.answered;
    return `<span class="hz">${o.hz}</span>${showPy?`<small>${o.py}${it.m==='listen'&&Q.answered?' · '+o.ru:''}</small>`:''}`;
  };
  const optCls=it.m==='zh2m'?'':'hzopt';
  const opts=it.opts.map((o,k)=>{
    let cls='opt '+optCls;
    if(Q.answered){if(o===w)cls+=' right';else if(k===it.chosen)cls+=' wrong'}
    return `<button class="${cls}" ${Q.answered?'disabled':''} onclick="answer(${k})"><span class="num">${k+1}</span>${optLabel(o)}</button>`;
  }).join('');
  let rv='';
  if(Q.answered){
    const ok=it.opts[it.chosen]===w;
    rv=`<div class="reveal">
      <div class="verdict ${ok?'ok':'no'}">${ok?['✓ Верно!','✓ 对了！','✓ 太棒了！','✓ 没错！'][Math.floor(Math.random()*4)]:'✗ Не совсем — слово вернётся чуть позже'}</div>
      <div class="rv-head">
        <div class="rv-hz hz">${c.hz}</div>
        <div><div class="rv-py">${c.py}</div><div class="rv-m">${w.ru} <span class="en">· ${w.en}</span></div></div>
        <div style="margin-left:auto" class="row"><button class="iconbtn" onclick="speak('${w.hz}')">🔊</button><button class="iconbtn" onclick="speak('${w.hz}',0.5)">🐢</button></div>
      </div>
      ${exampleHTML(w)}
      <div class="nextrow"><span class="kbd">Enter ↵</span><button class="btn" id="nextBtn" onclick="next()">Дальше →</button></div>
    </div>`;
  }
  app.innerHTML=`
  <div class="qtop">
    <button class="iconbtn" onclick="goHome()">✕</button>
    <div class="bar"><i style="width:${Q.done/Q.total*100}%"></i></div>
    <span class="kbd">${Q.done}/${Q.total}</span>
    <button class="iconbtn ${st.showPinyin?'on':''}" onclick="togglePinyin()" title="Пиньинь (P)">拼</button>
  </div>
  <div class="qcard">
    <div class="qhint">${Q.title} · ${modeHint(it.m)}</div>
    ${Q.combo>=3?`<div class="combo">🔥 ×${Q.combo}</div>`:''}
    ${prompt}
  </div>
  <div class="opts">${opts}</div>
  ${rv}`;
  if(Q.answered){const b=document.getElementById('nextBtn');if(b&&window.innerWidth<700)b.scrollIntoView({behavior:'smooth',block:'end'})}
}
function togglePinyin(){store.settings.showPinyin=!store.settings.showPinyin;save();render()}
function answer(k){
  if(!Q||Q.answered)return;
  const it=Q.items[Q.i];if(k>=it.opts.length)return;
  const ok=it.opts[k]===it.w;
  it.chosen=k;Q.answered=true;
  const first=!(it.w.hz in Q.first);
  if(first){Q.first[it.w.hz]=ok;srsUpdate(it.w,ok)}
  if(ok){Q.done++;Q.combo++;Q.maxCombo=Math.max(Q.maxCombo,Q.combo);if(first)Q.xp+=10+(Q.combo>=3?5:0);else Q.xp+=3}
  else{Q.combo=0;if(!Q.wrong.includes(it.w))Q.wrong.push(it.w);
    const pos=Math.min(Q.i+3+Math.floor(Math.random()*2),Q.items.length);
    Q.items.splice(pos,0,{w:it.w,m:it.m==='listen'?'listen':(it.m==='zh2m'?'m2zh':'zh2m')});}
  render();
  if(store.settings.autoAudio&&it.m!=='listen')speak(it.w.hz);
  else if(it.m==='listen'&&!ok)speak(it.w.hz);
}
function next(){
  if(!Q||!Q.answered)return;
  Q.i++;Q.answered=false;
  if(Q.i>=Q.items.length)return finish();
  render();window.scrollTo(0,0);autoPlayPrompt();
}
function finish(){
  const firstOk=Object.values(Q.first).filter(Boolean).length;
  const acc=Math.round(firstOk/Q.total*100);
  const st=acc>=90?3:acc>=75?2:acc>=50?1:0;
  if(Q.levelId!==null){const prev=store.levels[Q.levelId]||{best:0,acc:0};store.levels[Q.levelId]={best:Math.max(prev.best,st),acc:Math.max(prev.acc,acc)}}
  store.xp+=Q.xp;bumpStreak();save();
  Q.result={acc,st,firstOk};screen='result';render();window.scrollTo(0,0);
}
function renderResult(){
  const r=Q.result;const lid=Q.levelId;
  const msg=r.st===3?'太棒了！Отлично!':r.st===2?'很好！Хорошо!':r.st===1?'不错，继续加油！Неплохо, продолжайте!':'加油！Попробуйте ещё раз';
  const nextId=lid!==null&&lid<LEVELS.length-1?lid+1:null;
  app.innerHTML=`
  <div class="panel result">
    <div class="kbd">${Q.title}</div>
    <div class="bigstars">${stars(r.st,'').replace('class=""','')}</div>
    <div class="big">${r.acc}%</div>
    <div style="font-weight:600">${msg}</div>
    <div class="row" style="justify-content:center;margin-top:10px;gap:8px">
      <span class="stat">С первой попытки: <b>${r.firstOk}/${Q.total}</b></span>
      <span class="stat">⭐ +<b>${Q.xp}</b> XP</span>
      <span class="stat">🔥 Лучшая серия: <b>${Q.maxCombo}</b></span>
    </div>
    <div class="note">Слова уровня добавлены в повторение. Полоска уровня заполняется постепенно: слово становится «выученным», когда вы правильно ответите на него в разные дни.</div>
    ${Q.wrong.length?`<div class="mlist"><div class="lbl" style="margin-top:14px">Слова с ошибками — попадут в повторение</div>
      ${Q.wrong.map(w=>{const c=colorize(w);return `<div class="mitem"><div class="hz">${c.hz}</div><div class="info"><div>${c.py}</div><div style="color:var(--muted)">${w.ru} · ${w.en}</div></div><button class="iconbtn" onclick="speak('${w.hz}')">🔊</button></div>`}).join('')}</div>`:''}
    <div class="row" style="justify-content:center;margin-top:18px;gap:8px">
      <button class="btn ghost" onclick="goHome()">К уровням</button>
      ${lid!==null?`<button class="btn ghost" onclick="startLevelQuiz(${lid})">↻ Ещё раз</button>`:''}
      ${nextId!==null?`<button class="btn" onclick="openNext(${nextId})">Уровень ${nextId+1} →</button>`:''}
    </div>
  </div>`;
}
function openNext(id){screen='home';Q=null;sheet=id;render();window.scrollTo(0,0)}

/* ---------- Клавиатура ---------- */
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(screen==='quiz'&&Q){
    if(/^[1-4]$/.test(k)&&!Q.answered){answer(+k-1);e.preventDefault()}
    else if((k==='enter'||k===' ')&&Q.answered){next();e.preventDefault()}
    else if(k==='p'||k==='з'){togglePinyin()}
    else if(k==='r'||k==='к'){speak(Q.items[Q.i].w.hz)}
    else if(k==='escape'){goHome()}
  }else if(screen==='study'&&S){
    if(k===' '||k==='enter'){flip();e.preventDefault()}
    else if(k==='arrowright')studyMove(1);
    else if(k==='arrowleft')studyMove(-1);
    else if(k==='r'||k==='к')speak(S.words[S.i].hz);
    else if(k==='escape')goHome();
  }else if(screen==='home'&&sheet!==null&&k==='escape'){closeSheet()}
  else if(screen==='result'&&k==='enter'){goHome()}
});

render();
</script>
</body>
</html>
